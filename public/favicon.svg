<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e040fb"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>
    <linearGradient id="g2" x1="5" y1="9" x2="16" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8bfff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="g3" x1="27" y1="9" x2="16" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8bfff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Background with fuchsia/purple gradient -->
  <rect width="32" height="32" rx="7" fill="url(#g1)"/>
  <!-- Subtle inner glow -->
  <rect width="32" height="32" rx="7" fill="white" opacity="0.06"/>
  <!-- V left arm — thick white line -->
  <line x1="6"  y1="9"  x2="16" y2="24" stroke="url(#g2)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- V right arm — thick white line -->
  <line x1="26" y1="9"  x2="16" y2="24" stroke="url(#g3)" stroke-width="3.5" stroke-linecap="round"/>
</svg>
